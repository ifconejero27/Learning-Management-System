<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Management System</title>
    <link rel="stylesheet" href="/02-css/login.css" />
  </head>
  <body>
    <div class="background-color">
      <h1 id="title" style="color: #1e293b">
        Learning Management System (LMS)
      </h1>

      <div class="login-container">
        <div class="login-form">
          <h1>Welcome</h1>
          <p>Please log in to continue.</p>

          <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required />

            <input
              type="password"
              id="password"
              placeholder="Password"
              required
              />

            <button type="submit">Log In</button><br>
            <p id = "register-link">Don't have an account? <a href="/01-html/register.html"><strong>Register</strong></a></p>
          </form>
        </div>
        <div class="login-image">
      </div>
    </div>
    <script src="03-js/log-in-page.js"></script>
  </body>
</html>
